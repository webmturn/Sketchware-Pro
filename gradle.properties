# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ============================================================
# GRADLE DAEMON & JVM OPTIMIZATION
# ============================================================
# Optimized JVM arguments for faster compilation & lower memory consumption
# Uses parallel GC for better performance on multi-core systems
# Increased heap for complex project builds (4GB for dev, can be reduced to 2GB on low-RAM devices)
org.gradle.jvmargs=-Xmx4096m -Xms512m -Dfile.encoding=UTF-8 \
    -XX:+UseParallelGC \
    -XX:ParallelGCThreads=4 \
    -XX:ConcGCThreads=2 \
    -XX:+UnlockExperimentalVMOptions \
    -XX:G1NewCollectionHeuristicPercent=20 \
    -XX:G1ReservePercent=5 \
    -XX:InitiatingHeapOccupancyPercent=35 \
    -Dorg.gradle.internal.worker.tmpdir=/tmp/gradle-worker \
    -Dorg.gradle.workers.max=4

# ============================================================
# INCREMENTAL COMPILATION (Critical for Performance)
# ============================================================
# Enable incremental compilation - only recompile changed files
org.gradle.compiler.incremental=true
org.gradle.caching=true
org.gradle.caching.debug=false
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.configureondemand=true

# ============================================================
# KOTLIN COMPILER OPTIMIZATION
# ============================================================
# Enable parallel task execution for Kotlin compilation
kotlin.parallel.tasks.in.project=true
kotlin.compiler.incremental=true
kotlin.compiler.incremental.multiplatform=true
kotlin.compiler.jvm.target=17
kotlin.caching.enabled=true

# ============================================================
# ANDROID BUILD OPTIMIZATION
# ============================================================
# Use AndroidX support library structure
android.useAndroidX=true
# Don't automatically convert third-party libraries (already using AndroidX)
android.enableJetifier=false
# Disable testOnly attribute in AndroidManifest.xml
android.injected.testOnly=false
# Use non-transitive R class for faster compilation
android.nonTransitiveRClass=true
# Enable resource prefix validation
android.strictResourceAliases=true
# Disable unused resource shrinking in debug builds to speed them up
android.enableResourceOptimizations=true
# Faster incremental dex processing
android.incremental=true

# ============================================================
# DAEMON SETTINGS
# ============================================================
# Keep daemon alive for 3 minutes (reduces startup time between builds)
org.gradle.daemon.idletimeout=180000
# Prevent out-of-memory in daemon
org.gradle.daemon.useseparateclassloader=true

# ============================================================
# BUILD PERFORMANCE
# ============================================================
# Skip bytecode verification for faster builds
org.gradle.java.compile.sourceCompatibility=17
org.gradle.java.compile.targetCompatibility=17

# ============================================================
# WARNINGS
# ============================================================
org.gradle.warning.mode=all

# ============================================================
# DEPRECATION WARNINGS
# ============================================================
# Show all deprecation warnings (helps keep codebase modern)
org.gradle.deprecation.warnings.enabled=true
