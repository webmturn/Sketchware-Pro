name: Android CI

on:
  push:
    paths:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'resolver/**'
      - 'vendor-dx/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute format baseline
        id: format-baseline
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${FORMAT_BASE:-}"
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base "$base" HEAD || true)"
          else
            base=""
          fi
          if [[ -z "$base" ]]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Check Java formatting
        env:
          ORG_GRADLE_PROJECT_spotlessRatchetFrom: ${{ steps.format-baseline.outputs.base }}
        run: ./gradlew spotlessCheck

      - name: Check Java imports
        run: ./gradlew checkJavaImports

      - name: Verify package boundaries
        run: ./gradlew checkPackageBoundaries

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
