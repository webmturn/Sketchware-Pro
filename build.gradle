// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id "com.diffplug.spotless" version "8.11.0"
}

spotless {
    def baseline = providers.gradleProperty("spotlessRatchetFrom").getOrElse("origin/main")
    if (baseline) {
        ratchetFrom baseline
    }

    java {
        target "app/src/*/java/pro/sketchware/**/*.java"
        targetExclude "app/src/main/java/pro/sketchware/third_party/**"
        googleJavaFormat("1.36.1").aosp()
    }
}

tasks.named("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

// Kotlin string templates with nested quotes require a full Kotlin lexer.
@groovy.transform.CompileStatic
String maskCommentsAndLiterals(String source, boolean javaSource) {
    char[] code = source.toCharArray()
    int end = 0
    while (end < code.length) {
        int start = end
        char first = code[end]
        if (first == (char) '/' && source.startsWith('//', end)) {
            end += 2
            while (end < code.length && code[end] != (char) '\r' && code[end] != (char) '\n') end++
        } else if (first == (char) '/' && source.startsWith('/*', end)) {
            int close = source.indexOf('*/', end + 2)
            end = close < 0 ? code.length : close + 2
        } else if (first == (char) '"' || first == (char) "'") {
            boolean textBlock = source.startsWith('"""', end)
            String delimiter = textBlock ? '"""' : String.valueOf(first)
            end += delimiter.length()
            while (end < code.length) {
                if (code[end] == (char) '\\' && (javaSource || !textBlock)) {
                    end = Math.min(end + 2, code.length)
                } else if (source.startsWith(delimiter, end)) {
                    end += delimiter.length()
                    break
                } else {
                    end++
                }
            }
        } else {
            end++
            continue
        }

        for (int i = start; i < end; i++) {
            if (code[i] != (char) '\r' && code[i] != (char) '\n') code[i] = (char) ' '
        }
    }
    return new String(code)
}

tasks.register("checkJavaImports") {
    group = "verification"
    description = "Checks Java sources for redundant same-package imports."

    doLast {
        def violations = []
        def qualifiedName = /\p{javaJavaIdentifierPart}+(?:\s*\.\s*\p{javaJavaIdentifierPart}+)*/
        fileTree("app/src") {
            include "*/java/pro/sketchware/**/*.java"
            exclude "main/java/pro/sketchware/third_party/**"
        }.files.each { sourceFile ->
            def code = maskCommentsAndLiterals(sourceFile.getText("UTF-8"), true)
            def packageMatch = code =~ /\bpackage\s+(${qualifiedName})\s*;/
            if (!packageMatch.find()) return
            def declaredPackage = packageMatch.group(1).replaceAll(/\s+/, "")
            def imports = code =~ /\bimport\s+(?!static\b)(${qualifiedName}(?:\s*\.\s*\*)?)\s*;/
            imports.each { declaration ->
                def importedType = declaration[1].replaceAll(/\s+/, "")
                int separator = importedType.lastIndexOf('.')
                if (separator > 0 && importedType.substring(0, separator) == declaredPackage) {
                    violations.add("${rootProject.relativePath(sourceFile)}: ${importedType}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Redundant same-package Java imports found:\n"
                    + violations.sort().collect { " - ${it}" }.join("\n"))
        }
    }
}

tasks.register("checkPackageBoundaries") {
    group = "verification"
    description = "Checks retired packages, shared-service dependencies, and design-tab data access."

    doLast {
        def sourceRoot = file("app/src/main/java")
        def violations = [] as Set

        def retiredClassNames = [
                "com.bumptech.glide.signature.StringSignature",
                "pro.sketchware.core.project.BuiltInLibrary",
                "pro.sketchware.core.codegen.BlockColorMapper",
                "pro.sketchware.core.codegen.XmlLayoutParser",
                "pro.sketchware.tools.InjectRootLayoutManager",
                "pro.sketchware.tools.ViewBeanParser",
                "pro.sketchware.tools.ViewBeanFactory",
                "pro.sketchware.util.AttributeConstants",
                "pro.sketchware.util.BlockUtil",
                "pro.sketchware.util.CompileLogHelper",
                "pro.sketchware.util.CustomVariableUtil",
                "pro.sketchware.util.EditorUtils",
                "pro.sketchware.util.InjectAttributeHandler",
                "pro.sketchware.util.MoreblockSpecUtils",
                "pro.sketchware.util.SvgUtils",
                "pro.sketchware.util.TestkeySignBridge",
                "pro.sketchware.tools.ComponentHelper",
                "pro.sketchware.tools.ImageFactory",
                "pro.sketchware.util.ProjectFile",
                "pro.sketchware.core.codegen.DynamicPaletteProvider",
                "pro.sketchware.util.relativelayout.CircularDependencyDetector",
                "pro.sketchware.util.relativelayout.RelativeLayoutAttributes",
                "pro.sketchware.core.callback.ViewEnableRunnable",
                "pro.sketchware.util.PCP",
                "pro.sketchware.util.DebouncedClickListener",
                "pro.sketchware.util.FilePathUtil",
                "pro.sketchware.core.codegen.BlockTypeUtils",
                "pro.sketchware.core.codegen.BlockSpecRegistry",
                "pro.sketchware.core.codegen.ExtraBlockInfo",
                "pro.sketchware.util.MenuNameMapper",
                "pro.sketchware.core.build.ManifestGenerator",
                "pro.sketchware.lib.base.BaseTextWatcher",
                "pro.sketchware.lib.base.BaseViewBindingAdapter",
                "pro.sketchware.lib.base.BottomSheetDialogView",
                "pro.sketchware.dialogs.ProgressDialog"
        ]
        retiredClassNames.each { name ->
            ["java", "kt"].each { extension ->
                def retiredFile = new File(sourceRoot, name.replace('.', '/') + "." + extension)
                if (retiredFile.exists()) violations.add(retiredFile)
            }
        }
        def retiredTypes = retiredClassNames.collect { name ->
            java.util.regex.Pattern.compile('(?<![\\w$])' + java.util.regex.Pattern.quote(name) + '(?![\\w$])')
        }
        fileTree(sourceRoot) {
            include "pro/sketchware/**/*.java"
            include "pro/sketchware/**/*.kt"
            exclude "pro/sketchware/third_party/**"
        }.files.each { sourceFile ->
            def code = maskCommentsAndLiterals(sourceFile.getText("UTF-8"), sourceFile.name.endsWith(".java"))
            def path = sourceRoot.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
            if (retiredTypes.any { type -> type.matcher(code).find() }) {
                violations.add(sourceFile)
            }
            if ((path.startsWith("pro/sketchware/core/") || path.startsWith("pro/sketchware/util/"))
                    && (code =~ /\bpro\.sketchware\.(activities|dialogs)\./).find()) {
                violations.add(sourceFile)
            }
            if ((path == "pro/sketchware/core/project/ProjectSettings.java"
                    || path == "pro/sketchware/core/project/InjectRootLayoutManager.java"
                    || path.startsWith("pro/sketchware/core/settings/"))
                    && (code =~ /\bandroid\.(view|widget)\./).find()) {
                violations.add(sourceFile)
            }
            if (path.startsWith("pro/sketchware/core/layout/")
                    && (code =~ /\bpro\.sketchware\.core\.project\.SketchwarePaths\b/).find()) {
                violations.add(sourceFile)
            }
        }

        ["a/a/a", "com/besome/sketch", "dev", "mod"].each { retiredRoot ->
            def retiredDirectory = new File(sourceRoot, retiredRoot)
            if (retiredDirectory.exists()) {
                violations.addAll(fileTree(retiredDirectory) {
                    include "**/*.java"
                    include "**/*.kt"
                }.files)
            }
        }

        def coreRoot = new File(sourceRoot, "pro/sketchware/core")
        if (coreRoot.exists()) {
            violations.addAll(fileTree(coreRoot) {
                include "*.java"
                include "*.kt"
            }.files)
        }

        def designFragmentsRoot = new File(
                sourceRoot, "pro/sketchware/activities/design/fragments")
        if (designFragmentsRoot.exists()) {
            violations.addAll(fileTree(designFragmentsRoot) {
                include "*.java"
                exclude "DesignProjectFragment.java"
            }.files.findAll { sourceFile ->
                sourceFile.getText("UTF-8").contains("ProjectDataManager")
            })
        }

        if (!violations.isEmpty()) {
            def paths = violations
                    .collect { rootProject.relativePath(it) }
                    .sort()
                    .collect { " - ${it}" }
                    .join(System.lineSeparator())
            throw new GradleException("Package boundary violations found:${System.lineSeparator()}${paths}")
        }
    }
}
