// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

tasks.register("checkPackageBoundaries") {
    group = "verification"
    description = "Rejects retired package roots and direct global data access from design tabs."

    doLast {
        def sourceRoot = file("app/src/main/java")
        def violations = [] as Set

        ["a/a/a", "com/besome/sketch", "dev", "mod"].each { retiredRoot ->
            def retiredDirectory = new File(sourceRoot, retiredRoot)
            if (retiredDirectory.exists()) {
                violations.addAll(fileTree(retiredDirectory) {
                    include "**/*.java"
                    include "**/*.kt"
                }.files)
            }
        }

        def coreRoot = new File(sourceRoot, "pro/sketchware/core")
        if (coreRoot.exists()) {
            violations.addAll(fileTree(coreRoot) {
                include "*.java"
                include "*.kt"
            }.files)
        }

        def designFragmentsRoot = new File(
                sourceRoot, "pro/sketchware/activities/design/fragments")
        if (designFragmentsRoot.exists()) {
            violations.addAll(fileTree(designFragmentsRoot) {
                include "*.java"
                exclude "DesignProjectFragment.java"
            }.files.findAll { sourceFile ->
                sourceFile.getText("UTF-8").contains("ProjectDataManager")
            })
        }

        if (!violations.isEmpty()) {
            def paths = violations
                    .collect { rootProject.relativePath(it) }
                    .sort()
                    .collect { " - ${it}" }
                    .join(System.lineSeparator())
            throw new GradleException("Package boundary violations found:${System.lineSeparator()}${paths}")
        }
    }
}
